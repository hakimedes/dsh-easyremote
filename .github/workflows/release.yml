name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  mobile-changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Mobile needs a new build
        id: plan
        run: |
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          build=true
          if [ -n "$previous_tag" ] && git diff --quiet "$previous_tag" HEAD -- apps/mobile; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm pack:community
      - name: Audit package
        run: |
          tarball=$(find dist -maxdepth 1 -name 'hakimedes-dsh-easyremote-*.tgz' -print -quit)
          test -n "$tarball"
          tar -tzf "$tarball" > package-contents.txt
          ! grep -E '(\.env|\.sqlite|cert\.pem|credentials\.json|\.keystore|\.jks|node-identity)' package-contents.txt
          node -e "const p=require('./apps/easyremote/package.json'); if(p.scripts?.postinstall||p.scripts?.preinstall||p.scripts?.install) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz

  npm-publish:
    needs: npm-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-compatible npm
        run: npm install --global npm@11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release

      - name: Publish npm package
        run: |
          tarball=$(find release -maxdepth 1 -name 'hakimedes-dsh-easyremote-*.tgz' -print -quit)
          test -n "$tarball"
          npm publish "./$tarball" --access public

  android:
    needs: mobile-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.mobile-changes.outputs.build == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.mobile-changes.outputs.build == 'true'
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        if: needs.mobile-changes.outputs.build == 'true'
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: actions/setup-java@v4
        if: needs.mobile-changes.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: needs.mobile-changes.outputs.build == 'true'
      - if: needs.mobile-changes.outputs.build == 'true'
        run: pnpm install --frozen-lockfile
      - name: Prepare Community signing key
        if: needs.mobile-changes.outputs.build == 'true'
        env:
          DSH_KEYSTORE_BASE64: ${{ secrets.DSH_COMMUNITY_KEYSTORE_BASE64 }}
        run: |
          test -n "$DSH_KEYSTORE_BASE64"
          printf '%s' "$DSH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/community.keystore"
      - name: Build Community APK
        if: needs.mobile-changes.outputs.build == 'true'
        run: pnpm -C apps/mobile android:community:release
        env:
          ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_FILE: ${{ runner.temp }}/community.keystore
          ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_PASSWORD: ${{ secrets.DSH_COMMUNITY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_ALIAS: ${{ secrets.DSH_COMMUNITY_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_PASSWORD: ${{ secrets.DSH_COMMUNITY_KEY_PASSWORD }}
      - name: Stage APK
        if: needs.mobile-changes.outputs.build == 'true'
        run: |
          mkdir -p release
          apk=$(find apps/mobile/android/app/build/outputs/apk/community/release -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" release/DSH-EasyRemote-Community.apk
      - name: Reuse previous signed Community APK
        if: needs.mobile-changes.outputs.build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "${{ needs.mobile-changes.outputs.previous_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern DSH-EasyRemote-Community.apk \
            --dir release
      - uses: actions/upload-artifact@v4
        with:
          name: community-apk
          path: release/DSH-EasyRemote-Community.apk

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hub/Dockerfile
          push: true
          tags: |
            ghcr.io/hakimedes/dsh-easyremote-hub:${{ github.ref_name }}
            ghcr.io/hakimedes/dsh-easyremote-hub:latest

  github-release:
    # A registry or container outage must not block the signed Android release.
    # npm publication is an explicit, separately authenticated operation.
    needs: [npm-package, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Download Community APK
        uses: actions/download-artifact@v4
        with:
          name: community-apk
          path: release
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/dsh-easyremote-sbom.spdx.json
      - name: Create checksums
        working-directory: release
        run: sha256sum DSH-EasyRemote-Community.apk hakimedes-dsh-easyremote-*.tgz dsh-easyremote-sbom.spdx.json > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/DSH-EasyRemote-Community.apk
            release/hakimedes-dsh-easyremote-*.tgz
            release/dsh-easyremote-sbom.spdx.json
            release/SHA256SUMS
