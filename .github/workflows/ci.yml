name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm pack:community
      - name: Audit npm package contents
        run: |
          tarball=$(find dist -maxdepth 1 -name 'hakimedes-dsh-easyremote-*.tgz' -print -quit)
          test -n "$tarball"
          tar -tzf "$tarball" | tee package-contents.txt
          ! grep -E '(\.env|\.sqlite|cert\.pem|credentials\.json|\.keystore|\.jks|node-identity)' package-contents.txt
          node -e "const p=require('./apps/easyremote/package.json'); if(p.scripts?.postinstall||p.scripts?.preinstall||p.scripts?.install) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

