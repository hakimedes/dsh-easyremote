services:
  hub:
    # Advanced local-only option. The npm wizard does not require Docker.
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.hub
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
